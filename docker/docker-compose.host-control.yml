services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/openship/host-control-key:/run/openship/host-key:ro
      # The root docker-compose.yml api service (SaaS/from-source control plane)
      # deliberately ships with NO docker socket and NO edge volumes — see its
      # header comment. THIS install runs api from that file but edge/dashboard
      # from docker/docker-compose.yml (the self-hosted stack), so api still
      # needs the docker socket (to build/run deployed app containers) and the
      # same shared routing volumes edge reads from (so registerRoute's vhost
      # writes are actually visible to edge). Without these, api silently loses
      # deploy + routing capability on every recreate — discovered 2026-07-29
      # after ~1.5h of api running with only the host-control-key mount.
      - /var/run/docker.sock:/var/run/docker.sock
      - openship_sites:/usr/local/openresty/nginx/conf/sites-enabled
      - openship_certs:/etc/letsencrypt
      - openship_acme:/var/www/acme
      - openship_static:/opt/openship/static
    environment:
      OPENSHIP_HOST_SSH_HOST: host.docker.internal
      OPENSHIP_HOST_SSH_PORT: "22"
      OPENSHIP_HOST_SSH_USER: root
      OPENSHIP_HOST_SSH_KEY: /run/openship/host-key
      # THIS install's edge is the containerized one (docker/docker-compose.yml,
      # same as the shared routing volumes above) — without these, api can't
      # tell and falls back to treating this box as bare-host OpenResty. It then
      # writes _default.conf/_management.conf into the shared sites-enabled
      # volume, duplicating what's already baked into the openship-edge image's
      # own nginx.conf (see apps/edge/nginx.conf + DEFAULT_BLOCK in
      # packages/adapters/src/infra/openresty-lua.ts). That's always redundant,
      # and became FATAL ("duplicate default server for 0.0.0.0:80", crash-loop)
      # once DEFAULT_BLOCK started emitting explicit default_server — root cause
      # of the 2026-07-31 14:29 outage (all public sites 521 until openresty -t
      # was hand-patched). Setting these makes createInfraProvider skip
      # ensureOpenRestyConfig entirely for this box, matching docker/docker-compose.yml.
      OPENSHIP_EDGE_MODE: docker
      OPENSHIP_EDGE_CONTAINER: openship-edge
      # TEMPORARY, session-scoped (catalog Phase-1 QA, 2026-08-01): the app
      # catalog's remote overlay (see catalog-source.ts) is remote-wins with no
      # concept of "local edit, don't overwrite" - so this fork's local
      # available:true flips for the 12 QA'd apps would be silently reverted by
      # the next successful upstream fetch. Remove once these fixes land in an
      # upstream PR (matching the session's other cherry-picked fixes); the
      # remote overlay is otherwise a deliberate, useful feature and shouldn't
      # stay disabled indefinitely on a fork that plans to upstream its work.
      OPENSHIP_CATALOG_DISABLE_REMOTE: "true"
      # Missing on this box (discovered during catalog Phase-1 QA, 2026-08-01):
      # without it, resolveServerHost() (apps/api/src/lib/server-target.ts)
      # returns null for any project with no serverId snapshot, which skips
      # deploy.service.ts's "port-only, no-domain" {{publicUrl:<service>}}
      # fallback entirely (not "resolves wrong" — resolves to the EMPTY
      # string). Any catalog app that bakes its own base URL into runtime
      # config (Ghost's `url`, Directus' PUBLIC_URL, Gitea's ROOT_URL,
      # Vaultwarden's DOMAIN, ...) then fails strict URL validation and
      # crash-loops on a plain port-only install. Real public IP, confirmed via
      # `curl -4 ifconfig.me` on the host earlier this session.
      SERVER_IP: "152.228.238.183"

volumes:
  openship_sites:
  openship_certs:
  openship_acme:
  openship_static:
